<div class="relative hidden lg:block">
  <input
    type="checkbox"
    id="darkmode-toggle"
    class="invisible absolute pointer-events-none peer"
    aria-label="Toggle Dark Mode"
    onchange="handleManualToggle(this)"
  />

  <label
    for="darkmode-toggle"
    class="fixed top-0 left-0 w-screen h-screen bg-black opacity-50 z-10 hidden peer-checked:block"
  ></label>

  <label
    for="darkmode-toggle"
    class="flex flex-row gap-2 items-center cursor-pointer group px-4 py-2"
  >
    <!-- Soleil -->
    <svg class="w-6 h-6 text-yellow-500 dark:hidden" xmlns="http://www.w3.org/2000/svg" fill="none"
         viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 3v1m0 16v1m8.485-8.485h1M3.515 12.515h1m15.364 5.657l-.707-.707M5.636 5.636l-.707-.707m12.728 0l-.707.707M5.636 18.364l-.707.707M12 5a7 7 0 000 14 7 7 0 000-14z" />
    </svg>

    <!-- Lune -->
    <svg class="w-6 h-6 hidden dark:block text-white" xmlns="http://www.w3.org/2000/svg" fill="currentColor"
         viewBox="0 0 24 24">
      <path d="M21 12.79A9 9 0 0111.21 3 7 7 0 0012 21a9 9 0 009-8.21z" />
    </svg>
  </label>

  <div
    class="absolute right-0 top-full bg-white dark:bg-gray-900 py-4 text-gray-700 dark:text-gray-200 rounded-xl w-max shadow-xl hidden peer-checked:block z-20">
    <label for="darkmode-toggle" class="px-6 pb-2 text-xs uppercase text-gray-400 dark:text-gray-500">
      Thème
    </label>
    <ul class="flex flex-col">
      <li>
        <button
          class="px-6 py-2 text-left hover:bg-gray-100 dark:hover:bg-gray-700 w-full"
          onclick="setTheme('light')"
        >☀️ Clair</button>
      </li>
      <li>
        <button
          class="px-6 py-2 text-left hover:bg-gray-100 dark:hover:bg-gray-700 w-full"
          onclick="setTheme('dark')"
        >🌙 Sombre</button>
      </li>
      <li>
        <button
          class="px-6 py-2 text-left hover:bg-gray-100 dark:hover:bg-gray-700 w-full"
          onclick="setTheme('auto')"
        >🖥️ Automatique</button>
      </li>
    </ul>
  </div>
</div>
